services:
  sci-postgres:
    image: postgres:17.6
    container_name: sci-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - sci-postgres_data:/var/lib/postgresql/data
    networks:
      - sci-network

  sci-backend:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: sci-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      sci-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sci-network
    restart: unless-stopped

  sci-frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: sci-frontend
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      sci-backend:
        condition: service_healthy
    networks:
      - sci-network
    restart: unless-stopped

volumes:
  sci-postgres_data:

networks:
  sci-network:
    driver: bridge
