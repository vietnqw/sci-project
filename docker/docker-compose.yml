services:
  backend:
    build:
      context: ../backend
      dockerfile: ../backend/Dockerfile
    container_name: sci-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - ../.env
    networks:
      - sci-network
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../frontend/Dockerfile
    container_name: sci-frontend
    env_file:
      - ../.env
    networks:
      - sci-network
    ports:
      - "3000:3000"
    restart: unless-stopped

networks:
  sci-network:
    driver: bridge
